rationale: 'Qiyana is strong across the board: 53.8% WR in KR solo queue and 61% pro
  presence. Edge of Ixtal is her core damage tool from the first trade through late-game
  skirmishes, so one targeted nerf to it addresses both. The flat base damage cut
  (-10 at all ranks) trims her early lane trades and solo-queue snowball. The bonus
  AD ratio cut (0.9 -> 0.8) lowers her itemized late-game burst, which is where pro
  play gets its value. Players will read this as a single, clear "Q hits a little
  less hard" change. Her elemental utility, mobility and ultimate engage stay untouched,
  so her identity is preserved. Sim: soloq_index -0.90%, pro_index -0.44%, both inside
  the target bands.'
