rationale: "Viego is popular but losing in solo queue, especially in KR (48.9% WR\
  \ at 7% pick rate), and he barely shows up in pro play (1% presence). He needs more\
  \ early and mid-game strength without boosting his late-game, coordinated power.\
  \ Base AD 57 -> 61 makes his early clears and lane trades stronger. Q base damage\
  \ goes up at ranks 1-3 only (25/40/55 -> 30/45/60), with ranks 4-5 unchanged. That\
  \ front-loads the buff into the early game, when solo queue games are decided, and\
  \ his late-game ceiling stays where it is. Sim: soloq_index +0.85% (target 0.5\u2013\
  3%), pro_index +0.29% (cap 1%)."
