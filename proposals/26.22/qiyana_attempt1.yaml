rationale: 'Qiyana is in pro jail: 57% pro presence while she sits below 49% win rate
  in solo queue (47.7% global, 48.2% KR). Her coordinated late-game burst is what
  keeps her picked in pro, so we''re trimming her end-of-game damage and leaving her
  early game alone. Q (Edge of Ixtal) damage at ranks 4/5 goes from 160/190 to 150/165,
  and R (Supreme Display of Talent) bonus AD ratio goes from 1.25 to 1.10. Q ranks
  1-3, all base stats, W and E are unchanged, so her lane and early skirmish power
  stay the same for solo queue players. In simulation, pro power drops by about 1.2%
  and solo queue power doesn''t change. Lane trades and the level 9 duel are untouched;
  only late DPS and siege damage go down slightly.'
