rationale: 'Qiyana is strong in both settings: 52.7% WR in KR solo queue and 57% pro
  presence. We''re taking two small, readable cuts to her burst. Edge of Ixtal base
  damage goes down by a flat 12 at every rank (70/100/130/160/190 -> 58/88/118/148/178).
  That lowers her lane trades and early all-ins, which is where her solo queue strength
  comes from. Supreme Display of Talent base damage drops 10% (100/200/300 -> 90/180/270).
  That trims the coordinated teamfight and engage burst that drives her pro presence.
  Her ratios, cooldowns, CC and mobility stay the same, so she plays the same way,
  just with a bit less burst. Sim: soloq_index -0.70%, pro_index -0.47%, both inside
  the target bands.'
