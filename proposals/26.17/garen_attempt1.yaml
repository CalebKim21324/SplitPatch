champion: Garen
patch: '26.17'
category: SOLOQ_ONLY_STRONG
changes:
- field: base.ad
  from: 69.0
  to: 66.0
- field: abilities.E_judgment.base
  from:
  - 4.0
  - 7.0
  - 10.0
  - 13.0
  - 16.0
  to:
  - 3.2
  - 6.0
  - 9.0
  - 12.5
  - 16.0
rationale: 'Garen is overperforming in solo queue (53.2% WR global, 52.7% KR) while
  being essentially absent from pro play (1% presence). His strength is in lane: early
  trades and spinning-to-win before items come online. We''re trimming that early
  pressure without touching what defines him late: base AD 69 -> 66 makes his early
  autos and Q/E trades weaker in lane, and Judgment''s early-rank base damage is reduced
  (4/7/10/13/16 -> 3.2/6/9/12.5/16) so maxing E first is less oppressive while rank
  5 is unchanged. Ratios, ultimate, W and late-rank values are untouched, so his late-game/coordinated
  power (pro) stays where it is. Sim: soloq_index -0.98% (target -3% to -0.5%), pro_index
  +0.21% (target >= -0.5%).'
